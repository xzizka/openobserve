# Ansible configuration for the OpenObserve deploy project.
[defaults]
inventory = inventory.ini
roles_path = collections/ansible_collections
collections_path = collections/ansible_collections
host_key_checking = False
interpreter_python = auto_silent

# Make secrets overridable without moving them into the repo.
# Copy vault-example/vault.yml to group_vars/vault.yml and encrypt it,
# OR export these as host_vars if you do not use ansible-vault.
