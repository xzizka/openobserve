# OpenTelemetry javaagent configuration.
#
# The ingestion endpoint and credentials are intentionally NOT hardcoded here.
# They are injected via environment variables when the container is started:
#   OTEL_EXPORTER_OTLP_ENDPOINT  e.g. http://<openobserve-host>:5080/api/default
#   OTEL_EXPORTER_OTLP_HEADERS   e.g. Authorization=Basic%20<base64(email:password)>
#
# Overriding via env at runtime allows the same image to target any backend.

otel.service.name=demo-observability
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf

# Bridge application logs (java.util.logging) into the OTLP logs pipeline so
# they carry trace_id/span_id and correlate with traces.
otel.instrumentation.common.default-enabled=true
otel.instrumentation.java-util-logging.enabled=true
