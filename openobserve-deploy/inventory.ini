# Inventory for the OpenObserve production stack.
#
# Default: deploy onto the very machine you run Ansible ON.
[local]
localhost ansible_connection=local

# Deploying to a REMOTE clean host instead (uncomment, replace IP/user, ensure
# SSH key auth works):
#[vms]
#o2-host ansible_host=192.168.122.151 ansible_user=xzizka ansible_become=true

# OpenObserve nodes reachable over the network (used by e.g. the demo app to
# find OpenObserve when it runs on a different host).
[o2]
localhost ansible_connection=local

[all:vars]
ansible_python_interpreter=/usr/bin/python3
